name: notify-digest

on:
  schedule:
    - cron: '35 4 * * *'   # 北京 12:35
    - cron: '5 11 * * *'   # 北京 19:05
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'auto'
        type: choice
        options: [auto, manual]
      trigger_ts:
        description: '手动触发时刻（ISO，仅 manual 模式用）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - name: analyze and push
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_USER_OPENID: ${{ secrets.QQ_USER_OPENID }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          TRIGGER_TS: ${{ github.event.inputs.trigger_ts || '' }}
        run: python scripts/analyze.py
      - name: commit seen.json
        run: |
          git config user.name "notify-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.json data/inbox 2>/dev/null || true
          git commit -m "update seen $(date -u +%FT%TZ)" || true
          git push || true
